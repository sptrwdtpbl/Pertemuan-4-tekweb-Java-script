<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Latar Belakang</title>
</head>
<body>
    
    <h1>Ubah Latar Belakang</h1>
    <button onclick="ubahLatarBelakang()">Ubah Latar Belakang</button>

    <script>
        function ubahLatarBelakang() {
            document.body.style.backgroundColor = "lightblue";
        }
    </script>
</body>
