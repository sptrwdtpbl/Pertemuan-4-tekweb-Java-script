
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validasi Cantik</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background-color: #ffe4ec;
            background-image:
                radial-gradient(circle at 10% 20%, #ffb7cf 0 8px, transparent 9px),
                radial-gradient(circle at 15% 16%, #fff0f5 0 8px, transparent 9px),
                radial-gradient(circle at 20% 20%, #ffb7cf 0 8px, transparent 9px),
                radial-gradient(circle at 15% 24%, #fff0f5 0 8px, transparent 9px),
                radial-gradient(circle at 15% 20%, #f7a1bd 0 4px, transparent 5px),
                radial-gradient(circle at 85% 75%, #ffb7cf 0 10px, transparent 11px),
                radial-gradient(circle at 90% 70%, #fff0f5 0 10px, transparent 11px),
                radial-gradient(circle at 95% 75%, #ffb7cf 0 10px, transparent 11px),
                radial-gradient(circle at 90% 80%, #fff0f5 0 10px, transparent 11px),
                radial-gradient(circle at 90% 75%, #f7a1bd 0 5px, transparent 6px),
                linear-gradient(135deg, #ffe4ec, #fbd0df, #fff0f5);
            background-size: 100% 100%;
        }

        .flower {
            position: fixed;
            font-size: 65px;
            opacity: 0.7;
            pointer-events: none;
        }

        .flower1 {
            top: 30px;
            right: 50px;
        }

        .flower2 {
            bottom: 30px;
            left: 50px;
        }

        .flower3 {
            top: 45px;
            left: 50px;
            font-size: 45px;
        }

        .flower4 {
            bottom: 40px;
            right: 50px;
            font-size: 45px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.92);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(190, 90, 130, 0.2);
            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            color: #c04d7b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #a76a83;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #8f4663;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #efb5ca;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background-color: #fff9fb;
        }

        input:focus {
            border-color: #e77ca5;
            box-shadow: 0 0 5px rgba(231, 124, 165, 0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background-color: #df78a0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #c95783;
            transform: translateY(-2px);
        }

        #error-message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #b77a92;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            .flower {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌼</div>
    <div class="flower flower4">🌺</div>

    <div class="container">

        <h2>🌸 Form Validasi 🌸</h2>

        <p class="subtitle">
            Silakan masukkan nama dan email Anda
        </p>

        <div id="output4"></div>

        <div class="footer">
            Made with Love 💗
        </div>

    </div>

    <script>

        let form = document.createElement("form");

        let labelNama = document.createElement("label");
        labelNama.textContent = "Nama: ";

        let inputNama = document.createElement("input");
        inputNama.type = "text";
        inputNama.id = "nama";
        inputNama.placeholder = "Masukkan nama Anda";

        let labelEmail = document.createElement("label");
        labelEmail.textContent = "Email: ";

        let inputEmail = document.createElement("input");
        inputEmail.type = "email";
        inputEmail.id = "email";
        inputEmail.placeholder = "Masukkan email Anda";

        let btnSubmit = document.createElement("button");
        btnSubmit.type = "button";
        btnSubmit.textContent = "Submit 💗";

        let errorDiv = document.createElement("div");
        errorDiv.id = "error-message";
        errorDiv.style.color = "red";

        btnSubmit.onclick = function() {

            let nama = inputNama.value;
            let email = inputEmail.value;
            let errorMessage = "";

            if (nama === "") {
                errorMessage += "Nama tidak boleh kosong. ";
            }

            if (email.indexOf("@") === -1) {
                errorMessage += "Email harus mengandung @. ";
            }

            if (errorMessage !== "") {

                errorDiv.textContent = errorMessage;
                errorDiv.style.color = "red";

            } else {

                errorDiv.textContent =
                    "Form valid! Data berhasil dikirim. 💗";

                errorDiv.style.color = "green";

            }
        };

        form.appendChild(labelNama);
        form.appendChild(inputNama);
        form.appendChild(document.createElement("br"));

        form.appendChild(labelEmail);
        form.appendChild(inputEmail);
        form.appendChild(document.createElement("br"));

        form.appendChild(btnSubmit);
        form.appendChild(errorDiv);

        let outputDiv = document.getElementById("output4");
        outputDiv.appendChild(form);

    </script>

</body>
</html>
