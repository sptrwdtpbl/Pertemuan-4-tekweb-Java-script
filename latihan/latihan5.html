
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Cantik</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(
                135deg,
                #ffe4ec,
                #f8c8dc,
                #fff0f5
            );
        }

        .flower {
            position: fixed;
            font-size: 65px;
            opacity: 0.7;
            pointer-events: none;
        }

        .flower1 {
            top: 30px;
            left: 40px;
        }

        .flower2 {
            bottom: 30px;
            right: 40px;
        }

        .flower3 {
            top: 40px;
            right: 50px;
        }

        .flower4 {
            bottom: 40px;
            left: 50px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.94);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(190, 90, 130, 0.2);
            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            color: #c04d7b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #a76a83;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #task-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #efb5ca;
            border-radius: 10px;
            outline: none;
            background: #fff9fb;
            font-size: 14px;
        }

        #task-input:focus {
            border-color: #df78a0;
        }

        #add-task {
            padding: 12px 18px;
            background: #df78a0;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #add-task:hover {
            background: #c95783;
        }

        #task-list {
            list-style: none;
        }

        #task-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            margin-bottom: 12px;
            background: #fff0f5;
            border-radius: 10px;
            border: 1px solid #f7d2df;
        }

        #task-list input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #df78a0;
            cursor: pointer;
            flex-shrink: 0;
        }

        #task-list span {
            flex: 1;
            min-width: 0;
            color: #75445a;
            overflow-wrap: anywhere;
        }

        #task-list button {
            padding: 7px 12px;
            background: #e87991;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transition: 0.3s;
        }

        #task-list button:hover {
            background: #ce526e;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #b77a92;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            .flower {
                font-size: 40px;
            }

            #add-task {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌼</div>
    <div class="flower flower4">🌺</div>

    <div class="container">

        <h2>🌸 My To-Do List 🌸</h2>

        <p class="subtitle">
            Catat semua kegiatan dan tugasmu!
        </p>

        <div id="output5"></div>

        <div class="footer">
            Make Your Day Beautiful 💗
        </div>

    </div>

    <script>

        let inputTask = document.createElement("input");
        inputTask.type = "text";
        inputTask.placeholder = "Masukkan tugas baru...";
        inputTask.id = "task-input";

        let btnAdd = document.createElement("button");
        btnAdd.textContent = "Tambah";
        btnAdd.id = "add-task";

        let taskList = document.createElement("ul");
        taskList.id = "task-list";

        let inputGroup = document.createElement("div");
        inputGroup.className = "input-group";

        inputGroup.appendChild(inputTask);
        inputGroup.appendChild(btnAdd);

        btnAdd.onclick = function() {

            let taskText = inputTask.value.trim();

            if (taskText !== "") {
                addTask(taskText);
                inputTask.value = "";
                saveTasks();
            }

        };

        function addTask(taskText) {

            let li = document.createElement("li");

            let checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            let taskSpan = document.createElement("span");
            taskSpan.textContent = taskText;

            checkbox.addEventListener("change", function() {

                if (this.checked) {
                    taskSpan.style.textDecoration = "line-through";
                } else {
                    taskSpan.style.textDecoration = "none";
                }

                saveTasks();

            });

            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Hapus";

            deleteBtn.addEventListener("click", function() {

                li.remove();
                saveTasks();

            });

            li.appendChild(checkbox);
            li.appendChild(taskSpan);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);

        }

        // Fungsi menyimpan tugas
        function saveTasks() {

            let tasks = [];

            document.querySelectorAll("#task-list li")
            .forEach(function(li) {

                let taskText =
                    li.querySelector("span").textContent;

                let isCompleted =
                    li.querySelector("input[type='checkbox']").checked;

                tasks.push({
                    text: taskText,
                    completed: isCompleted
                });

            });

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }

        // Fungsi memuat tugas
        function loadTasks() {

            let savedTasks = localStorage.getItem("tasks");

            if (savedTasks) {

                let tasks = JSON.parse(savedTasks);

                tasks.forEach(function(task) {

                    addTask(task.text);

                    let lastAdded = taskList.lastChild;

                    let checkbox = lastAdded.querySelector(
                        "input[type='checkbox']"
                    );

                    checkbox.checked = task.completed;

                    if (task.completed) {

                        lastAdded.querySelector("span")
                        .style.textDecoration = "line-through";

                    }

                });

            }

        }

        // Menambahkan elemen ke output
        let outputDiv = document.getElementById("output5");

        outputDiv.appendChild(inputGroup);
        outputDiv.appendChild(taskList);

        // Memuat tugas yang disimpan
        loadTasks();

    </script>

</body>
</html>
