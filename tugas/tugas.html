
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(
                135deg,
                #ffe4ec,
                #f8c8dc,
                #fff0f5
            );
        }

        .flower {
            position: fixed;
            font-size: 65px;
            opacity: 0.7;
            pointer-events: none;
        }

        .flower1 {
            top: 30px;
            left: 40px;
        }

        .flower2 {
            bottom: 30px;
            right: 40px;
        }

        .flower3 {
            top: 40px;
            right: 50px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background-color: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(190, 90, 130, 0.2);
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #c04d7b;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #a76a83;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #8f4663;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #efb5ca;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background-color: #fff9fb;
        }

        input:focus {
            border-color: #df78a0;
        }

        h3 {
            color: #a34f72;
            margin-bottom: 12px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .button-group button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: #df78a0;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .button-group button:hover {
            background-color: #c95783;
            transform: translateY(-3px);
        }

        .hasil-box {
            background-color: #fff0f5;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #f7d2df;
        }

        #hasil {
            color: #c04d7b;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            overflow-wrap: anywhere;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background-color: #b77a92;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .reset-btn:hover {
            background-color: #96536e;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #b77a92;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            .flower {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌼</div>

    <div class="container">

        <h1>🌸 Kalkulator Cantik 🌸</h1>

        <p class="subtitle">
            Kalkulator Sederhana
        </p>

        <div class="input-group">
            <label for="angka1">Angka Pertama</label>
            <input type="number" id="angka1"
                placeholder="Masukkan angka pertama">
        </div>

        <div class="input-group">
            <label for="angka2">Angka Kedua</label>
            <input type="number" id="angka2"
                placeholder="Masukkan angka kedua">
        </div>

        <h3>Pilih Operasi</h3>

        <div class="button-group">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">×</button>
            <button onclick="hitung('/')">÷</button>
        </div>

        <div class="hasil-box">
            <h3>Hasil Perhitungan</h3>
            <p id="hasil">Hasil akan muncul di sini</p>
        </div>

        <button class="reset-btn" onclick="resetKalkulator()">
            Reset
        </button>

        <p class="footer">Made with Love 💗</p>

    </div>

    <script src="./tugas.js"></script>

</body>
</html>
